name: Build Nattawut SmartGauge APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK from uploaded project ZIP or repository source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "Nattawut_SmartGauge_GPS_Source_v3_1.zip" ]]; then
            mkdir -p source
            unzip -q "Nattawut_SmartGauge_GPS_Source_v3_1.zip" -d source
            cd source
          fi
          test -f app/build.gradle
          gradle --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/app-debug.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nattawut-SmartGauge-debug-apk
          path: out/app-debug.apk
          if-no-files-found: error
