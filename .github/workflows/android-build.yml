
name: Build Nattawut SmartGauge APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nattawut-SmartGauge-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
