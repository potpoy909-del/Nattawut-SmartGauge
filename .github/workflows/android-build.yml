name: Build Nattawut SmartGauge APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "100.zip" ]; then
            echo "ERROR: 100.zip was not found in the repository root."
            echo "Files in repository root:"
            ls -la
            exit 1
          fi
          mkdir -p android-project
          unzip -oq "100.zip" -d android-project
          echo "Extracted files:"
          find android-project -maxdepth 3 -type f | sort | head -100
          if [ ! -f android-project/settings.gradle ] && [ ! -f android-project/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle(.kts) not found at ZIP root."
            echo "The ZIP may contain an extra top-level folder."
            exit 1
          fi
          if [ ! -f android-project/app/build.gradle ] && [ ! -f android-project/app/build.gradle.kts ]; then
            echo "ERROR: app/build.gradle(.kts) not found."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nattawut-SmartGauge-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
